name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare files
        run: |
          mkdir -p www assets tools
          [ -f www/index.html ] || cp index.html www/index.html
          [ -f assets/icon.jpg ] || cp icon.jpg assets/icon.jpg
          [ -f tools/make_icons.py ] || cp make_icons.py tools/make_icons.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Make launcher icons
        run: |
          pip install pillow
          python tools/make_icons.py
      - name: Copy web app into Android project
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: shkilnyi-avtobus-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
